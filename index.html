
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101116">
  <title>Roblox KI Developer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #101116;
      color: #f5f5fa;
      font-family: Arial, sans-serif;
    }

    header {
      height: 75px;
      padding: 0 22px;
      display: flex;
      align-items: center;
      gap: 13px;
      border-bottom: 1px solid #292b35;
    }

    .logo {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      background: #7657e8;
      border-radius: 12px;
      font-weight: bold;
    }

    main {
      max-width: 760px;
      margin: 90px auto;
      padding: 22px;
      text-align: center;
    }

    .tag {
      color: #a991ff;
      font-size: 12px;
      letter-spacing: 2px;
    }

    h2 {
      font-size: clamp(36px, 8vw, 58px);
      line-height: 1.12;
      margin: 24px 0;
    }

    .description {
      color: #a7a9b5;
      line-height: 1.8;
      font-size: 16px;
    }

    .chat {
      margin-top: 42px;
      padding: 18px;
      background: #1b1d26;
      border: 1px solid #343746;
      border-radius: 18px;
      text-align: left;
    }

    textarea {
      width: 100%;
      min-height: 120px;
      padding: 15px;
      resize: vertical;
      border-radius: 12px;
      border: 1px solid #363947;
      background: #111319;
      color: white;
      font-size: 15px;
      outline: none;
    }

    button {
      width: 100%;
      margin-top: 14px;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: #7657e8;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    button:active {
      transform: scale(0.98);
    }

    footer {
      margin-top: 45px;
      color: #777b89;
      font-size: 12px;
    }
  </style>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <div class="logo">RK</div>
    <strong>Roblox KI Developer</strong>
  </header>

  <main>
    <div class="tag">YOUR ROBLOX AI DEVELOPER</div>

    <h2>
      Deine Idee.<br>
      Dein Spiel. Deine KI.
    </h2>

    <p class="description">
      Entwickle Roblox-Spiele mit deiner eigenen
      spezialisierten KI. Erstelle Luau-Skripte,
      behebe Fehler und baue komplette Spielsysteme.
    </p>

    <div class="chat">
      <textarea
        placeholder="Was möchtest du in Roblox entwickeln?"
      ></textarea>

      <button onclick="alert('Der KI-Chat wird als nächstes programmiert!')">
        KI starten →
      </button>
    </div>

    <footer>
      Roblox KI Developer · 2026
    </footer>
  </main>

</body>
</html>
